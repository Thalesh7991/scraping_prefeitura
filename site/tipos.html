<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Por tipo de proposta — Câmara de Botucatu em Dados</title>
<meta name="description" content="Explore as propostas dos vereadores de Botucatu por tipo.">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>
<nav class="site-nav" id="site-nav"></nav>

<main class="container">
  <h2 class="page-title">Explorar por tipo de proposta</h2>
  <p class="page-subtitle">Escolha um tipo para ver a lista completa e como cada uma foi decidida.</p>

  <div class="field" style="max-width:420px">
    <label class="field-label" for="select-tipo">Escolha um tipo</label>
    <select id="select-tipo"></select>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:1.5rem">
    <div class="card stat-tile"><p class="stat-label">Total na legislatura atual</p><p class="stat-value" id="stat-total-tipo">—</p></div>
  </div>

  <div class="card chart-card"><div class="chart-wrap"><canvas id="grafico-tipo-situacao"></canvas></div></div>

  <h3 class="section-title">Lista de propostas</h3>
  <div id="tabela-tipo"></div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/charts.js"></script>
<script>
montarLayout("tipos");

let graficoAtual = null;

function renderizarTipo(proposituras, tipo) {
  const subset = proposituras.filter((p) => p.tipo === tipo);
  document.getElementById("stat-total-tipo").textContent = CamaraData.formatarNumero(subset.length);

  const porStatus = CamaraData.agrupar(subset, "status");
  const statusPresentes = CamaraData.STATUS_ORDEM.filter((s) => porStatus[s]);
  if (graficoAtual) graficoAtual.destroy();
  graficoAtual = graficoBarrasStatus(
    "grafico-tipo-situacao",
    statusPresentes,
    statusPresentes.map((s) => porStatus[s]),
    statusPresentes.map((s) => CamaraData.CORES_STATUS[s])
  );

  CamaraData.tabelaProposituras("tabela-tipo", subset);
}

CamaraData.carregar().then(({ proposituras, meta }) => {
  atualizarCabecalho(meta);

  const tipos = [...new Set(proposituras.map((p) => p.tipo))].sort();
  const select = document.getElementById("select-tipo");
  select.innerHTML = tipos.map((t) => `<option value="${CamaraData.escapeHtml(t)}">${CamaraData.escapeHtml(t)}</option>`).join("");
  select.addEventListener("change", () => renderizarTipo(proposituras, select.value));

  renderizarTipo(proposituras, tipos[0]);
});
</script>
</body>
</html>
